name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # '>=1.21' used to mean "current Go", but as an open-ended range it
        # races ahead of pinned tooling: it recently resolved to a
        # brand-new Go 1.26 that golangci-lint's own binary (built with
        # go1.24) can't type-check against ("file requires newer Go version
        # go1.26"). Pinned to a concrete, stable release instead so this
        # leg doesn't silently start failing again the next time a new Go
        # version ships before the tool ecosystem catches up.
        go: [ '1.20', '1.24' ]

    services:
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version-file: "go.mod"
          cache: true
          go-version: ${{ matrix.go }}

      - name: Format
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Install dependencies
        run: go get ./...

      - name: Vet
        run: go vet -v ./...

      - name: Install sqlclosecheck
        # sqlclosecheck@latest (v0.6.0) declares `go 1.25.0` in its go.mod,
        # a version-string format the go1.20 toolchain's module loader can't
        # even parse ("must match format 1.23") — so the 1.20 leg needs the
        # older v0.5.1, the newest release with a plain `go 1.20` directive.
        # But v0.5.1 pins golang.org/x/tools@v0.12.0, which fails to *compile*
        # under a modern Go compiler (a stricter constant-overflow check
        # added since); the >=1.21 leg needs @latest's newer x/tools instead.
        # Neither single version satisfies both legs, so pick by matrix.go.
        run: |
          if [ "${{ matrix.go }}" = "1.20" ]; then
            go install github.com/ryanrolds/sqlclosecheck@v0.5.1
          else
            go install github.com/ryanrolds/sqlclosecheck@latest
          fi

      - name: sqlclosecheck
        run: go vet -vettool=${HOME}/go/bin/sqlclosecheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -parallel 1 ./...
        env:
          LIBSQL_TEST_HTTP_DB_URL: "http://127.0.0.1:8080"
          LIBSQL_TEST_WS_DB_URL: "ws://127.0.0.1:8080"
