version: "3.9"

services:
  # ===== Backend API =====
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ghyari-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ghyari-network

  # ===== Frontend =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ghyari-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ghyari-network

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: ghyari-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ghyari-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ===== AI Radar Worker =====
  ai-radar:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: ghyari-ai-radar
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - REDIS_URL=redis://redis:6379
      - SCAN_INTERVAL=300
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ghyari-network

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: ghyari-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/ghyari:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - ghyari-network

volumes:
  redis_data:
    driver: local

networks:
  ghyari-network:
    driver: bridge
