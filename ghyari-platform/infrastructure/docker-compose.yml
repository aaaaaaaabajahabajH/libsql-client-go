version: "3.9"

services:
  # ===== Backend API =====
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ghyari-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://ghyari.sa,https://www.ghyari.sa}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ghyari-network

  # ===== Frontend =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: ghyari-frontend
    restart: unless-stopped
    networks:
      - ghyari-network

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: ghyari-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ghyari-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ===== AI Radar Worker =====
  ai-radar:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: ghyari-ai-radar
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN}
      - REDIS_URL=redis://redis:6379
      - SCAN_INTERVAL=${SCAN_INTERVAL:-300}
      - MCP_SERVERS=${MCP_SERVERS:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ghyari-network

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: ghyari-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/ghyari:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - ghyari-network

volumes:
  redis_data:
    driver: local

networks:
  ghyari-network:
    driver: bridge
