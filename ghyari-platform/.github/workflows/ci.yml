name: Ghyari CI/CD

on:
  push:
    branches: [main, "claude/*"]
    paths:
      - "ghyari-platform/**"
  pull_request:
    branches: [main]
    paths:
      - "ghyari-platform/**"

defaults:
  run:
    working-directory: ghyari-platform

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────── Backend ──────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghyari-platform/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ghyari-platform/backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/ghyari-api .

      - name: Binary size
        run: |
          SIZE=$(du -sh /tmp/ghyari-api | cut -f1)
          echo "### Binary: $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Integration smoke test
        env:
          DATABASE_URL: "file:/tmp/ci-test.db"
        run: |
          /tmp/ghyari-api &
          PID=$!
          sleep 3
          STATUS=$(curl -sf http://localhost:8080/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "fail")
          kill $PID || true
          [[ "$STATUS" == "healthy" ]] || (echo "❌ Health check failed: $STATUS" && exit 1)
          echo "✅ API healthy"

  # ────────────────────────── Frontend ─────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghyari-platform/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ghyari-platform/frontend/package-lock.json

      - name: Install
        run: npm ci --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_API_URL: "https://api.ghyari.sa/api/v1"
        run: npm run build

      - name: Bundle size report
        run: |
          TOTAL=$(du -sh dist | cut -f1)
          JS=$(du -sh dist/assets/*.js 2>/dev/null | awk '{sum+=$1} END {print sum"K"}' || echo "?")
          echo "### Frontend bundle: $TOTAL (JS: $JS)" >> $GITHUB_STEP_SUMMARY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ghyari-platform/frontend/dist/
          retention-days: 7

  # ────────────────────────── Mobile (React Native / Expo) ─────────────────────
  mobile:
    name: Mobile (Expo + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghyari-platform/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ghyari-platform/mobile/package-lock.json

      - name: Install
        run: npm ci --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Validate app.json
        run: node -e "
          const cfg = require('./app.json');
          const ios = cfg.expo.ios;
          if (!ios.bundleIdentifier) throw new Error('Missing bundleIdentifier');
          if (!ios.privacyManifests) throw new Error('Missing privacyManifests (required iOS 17+)');
          console.log('app.json valid — bundle:', ios.bundleIdentifier);
        "

  # ────────────────────────── Performance baseline ──────────────────────────────
  perf-baseline:
    name: Performance Baseline
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ghyari-platform/backend/go.sum

      - name: Build API
        run: |
          cd ghyari-platform/backend
          CGO_ENABLED=0 go build -o /tmp/ghyari-api .

      - name: Start API
        env:
          DATABASE_URL: "file:/tmp/perf-test.db"
        run: |
          /tmp/ghyari-api &
          echo "API_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz | \
            tar -xz --strip-components=1 -C /usr/local/bin k6-v0.52.0-linux-amd64/k6

      - name: Run load test (short CI version)
        run: |
          k6 run \
            --vus 10 --duration 30s \
            --env BASE_URL=http://localhost:8080 \
            --out json=/tmp/k6-results.json \
            ghyari-platform/scripts/k6/load_test.js \
          || true   # don't fail CI on threshold breach — report instead

      - name: Parse results
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open("/tmp/k6-results.json"))
              print("### k6 Performance Results")
              for metric in ["http_req_duration", "http_req_failed", "http_reqs"]:
                  m = data.get("metrics", {}).get(metric, {})
                  vals = m.get("values", {})
                  print(f"- **{metric}**: p95={vals.get('p(95)', '?'):.1f}ms, p99={vals.get('p(99)', '?'):.1f}ms" if "p(95)" in vals else f"- **{metric}**: {vals}")
          except Exception as e:
              print(f"Could not parse results: {e}")
          EOF

      - name: Kill API
        if: always()
        run: kill $API_PID 2>/dev/null || true

  # ────────────────────────── Docker build ─────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ghyari-platform/backend
          push: false
          tags: ghyari-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ghyari-platform/frontend
          push: false
          tags: ghyari-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
